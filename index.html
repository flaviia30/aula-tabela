<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        th, td {
            border: 1px solid black
        }

        tfoot {
            background-color: cyan;
        }
    </style>

</head>

<body>
    
    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço</th>
                <th>Black Friday</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Vestido</td>
                <td>2</td>
                <td>50$</td>
                <td rowspan="2">Sim</td>
            </tr>

            <tr>
                <td>Blusa</td>
                <td>5</td>
                <td>20$</td>
            </tr>

            <tr>
                <td>Calça</td>
                <td>3</td>
                <td>20$</td>
                <td>Não</td>
            </tr>

        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">Total</td>
                <td>90$</td>
            </tr>
        </tfoot>

        
    </table>

</body>
</html>
